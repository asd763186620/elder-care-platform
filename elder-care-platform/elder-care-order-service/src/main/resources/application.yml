# 订单服务本地基础配置。
server:
  # 订单服务端口。
  port: 8104

spring:
  datasource:
    # MySQL 连接地址。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:order_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # MySQL 用户名。
    username: ${MYSQL_USERNAME:root}
    # MySQL 密码。
    password: ${MYSQL_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # Redis 主机。
      host: ${REDIS_HOST:127.0.0.1}
      # Redis 端口。
      port: ${REDIS_PORT:6379}
  rabbitmq:
    # RabbitMQ 主机。
    host: ${RABBITMQ_HOST:127.0.0.1}
    # RabbitMQ AMQP 端口。
    port: ${RABBITMQ_PORT:5672}
    # RabbitMQ 用户名。
    username: ${RABBITMQ_USERNAME:elder}
    # RabbitMQ 密码。
    password: ${RABBITMQ_PASSWORD:elder123456}
  cloud:
    openfeign:
      circuitbreaker:
        # 开启 OpenFeign fallbackFactory，避免远程服务异常直接冒泡成 500。
        enabled: true
      client:
        config:
          default:
            # Spring Cloud OpenFeign 4.x 推荐配置：连接超时，单位毫秒。
            connectTimeout: 3000
            # Spring Cloud OpenFeign 4.x 推荐配置：读取超时，单位毫秒。
            readTimeout: 5000

mybatis-plus:
  configuration:
    # 控制台输出 SQL，方便第一阶段学习和调试。
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

feign:
  client:
    config:
      default:
        # Feign 连接超时，单位毫秒。
        connectTimeout: 3000
        # Feign 读取超时，单位毫秒。
        readTimeout: 5000

management:
  endpoints:
    web:
      exposure:
        # 暴露健康检查端点。
        include: health,info

elder-care:
  jwt:
    # 演示用 JWT 密钥。
    secret: ${JWT_SECRET:elder-care-platform-jwt-secret-demo-please-change}
    # Token 默认有效期为 2 小时。
    expire-seconds: ${JWT_EXPIRE_SECONDS:7200}
  mq:
    # 订单状态变化后发送通知消息的队列。
    notify-queue: elder.care.notify.queue
