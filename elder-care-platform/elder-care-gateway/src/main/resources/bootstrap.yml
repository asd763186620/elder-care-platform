# bootstrap.yml 会优先于 application.yml 加载，适合放服务名和 Nacos 地址。
spring:
  application:
    # 当前服务注册到 Nacos 的名称。
    name: elder-care-gateway
  cloud:
    nacos:
      # Nacos 服务地址，Docker Compose 内部可使用 nacos:8848，本机运行可使用 127.0.0.1:8848。
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        # 注册中心地址，默认复用 spring.cloud.nacos.server-addr。
        server-addr: ${spring.cloud.nacos.server-addr}
      config:
        # 配置中心地址，默认复用 spring.cloud.nacos.server-addr。
        server-addr: ${spring.cloud.nacos.server-addr}
        # Nacos 配置文件后缀，例如 elder-care-gateway.yaml。
        file-extension: yaml
        import-check:
          # 第一版允许本地没有 Nacos 配置文件时也能启动。
          enabled: false
