# 用户服务本地基础配置。
server:
  # 用户服务端口。
  port: 8101

spring:
  datasource:
    # MySQL 连接地址。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:user_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # MySQL 用户名。
    username: ${MYSQL_USERNAME:root}
    # MySQL 密码。
    password: ${MYSQL_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # Redis 主机。
      host: ${REDIS_HOST:127.0.0.1}
      # Redis 端口。
      port: ${REDIS_PORT:6379}
  rabbitmq:
    # RabbitMQ 主机。
    host: ${RABBITMQ_HOST:127.0.0.1}
    # RabbitMQ AMQP 端口。
    port: ${RABBITMQ_PORT:5672}
    # RabbitMQ 用户名。
    username: ${RABBITMQ_USERNAME:elder}
    # RabbitMQ 密码。
    password: ${RABBITMQ_PASSWORD:elder123456}

mybatis-plus:
  configuration:
    # 控制台输出 SQL，方便第一阶段学习和调试。
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        # 暴露健康检查端点。
        include: health,info

elder-care:
  jwt:
    # 演示用 JWT 密钥。
    secret: ${JWT_SECRET:elder-care-platform-jwt-secret-demo-please-change}
    # Token 默认有效期为 7 天。
    expire-seconds: ${JWT_EXPIRE_SECONDS:604800}
  wechat-mini-app:
    # 微信小程序 appId，真实环境通过环境变量或 Nacos 配置。
    app-id: ${WECHAT_MINI_APP_ID:wx555d830d73f10a1f}
    # 微信小程序 appSecret，真实环境必须放在安全配置中。
    secret: ${WECHAT_MINI_APP_SECRET:05e61cb2917c35c1e2b2e04b250ef478}
    # 已切换为真实微信链路；未配置 appId/secret 时直接报错，不再生成 mock openId。
    mock-enabled: ${WECHAT_MINI_APP_MOCK_ENABLED:false}
